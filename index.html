<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe Costs</title>
<meta name="theme-color" content="#2f5d50">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a practical kitchen tool for a household, friendly and quick on a phone
   IDEA: every recipe becomes a supermarket till docket, one per store, side by side
   PICTURE: the cost docket with the three supermarkets and the split shop, big totals
   COLOUR and TYPE: white, bay-leaf green band, tomato accent, chain dots in their own colours; Archivo + Inter, DM Mono for money
   LAYOUT: green header with tabs, one calm column up to 820px, stacks cleanly on a phone */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#101412);--ink:light-dark(#16201b,#ecefea);--mute:light-dark(#5b6861,#9ba69f);--line:light-dark(#e2e6e2,#29302c);--leaf:light-dark(#2f5d50,#1b382f);--tom:light-dark(#cf3a20,#ff6a4d);--paper:light-dark(#ffffff,#191e1b);--soft:light-dark(#f2f5f1,#161b18);--pns:#f2c200;--ww:#1f8a43;--nw:#d9142a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;line-height:1.05;text-wrap:balance;margin:0}
h2.v{font-size:28px;margin-bottom:6px}h3.s{font-size:20px;margin:28px 0 8px}
header.top{background:var(--leaf);color:#f3f7f2;padding:20px max(5vw,16px) 0}
header.top h1{font-size:clamp(28px,6vw,42px);font-weight:800}
header.top p{margin:4px 0 14px;opacity:.85}
nav{display:flex;gap:2px;overflow-x:auto}
nav a{flex:none;color:#f3f7f2;text-decoration:none;padding:12px 10px;font-size:15px;border-radius:12px 12px 0 0;font-weight:600;min-height:44px}
nav a[aria-current=page]{background:var(--bg);color:var(--ink)}
nav a .n{font:500 12px "DM Mono",monospace;background:var(--tom);color:#fff;border-radius:9px;padding:1px 6px;margin-left:4px}
main{max-width:820px;margin:0 auto;padding:22px max(4vw,14px) 80px}
button,.btn{font:600 16px Inter,sans-serif;min-height:44px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.go{background:var(--tom)!important;border-color:var(--tom)!important;color:#fff!important}
button.link{border:0;background:none;color:var(--tom);padding:6px 0;min-height:32px;text-decoration:underline}
button:disabled{opacity:.6}
:focus-visible{outline:3px solid var(--tom);outline-offset:2px}
input,textarea,select{font:16px Inter,sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:120px;resize:vertical}#a-t{min-height:240px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
.hint{color:var(--mute);font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.card{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:16px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);cursor:pointer;width:100%}
.card h3{font-size:19px}.card .p{font:500 20px "DM Mono",monospace;white-space:nowrap;text-align:right}
.card .s{color:var(--mute);font-size:14px}.card .s b{color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{min-height:36px;padding:4px 12px;border-radius:18px;font-size:14px}.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{font-size:12px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:4px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:0;flex:none}
.docket{background:var(--paper);border:1.5px solid var(--line);border-bottom:0;padding:22px clamp(16px,4vw,30px) 40px;margin:14px 0 8px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/16px 100%}
.docket h2{font-size:clamp(24px,5vw,34px);margin-bottom:6px}
.src{font-size:14px;color:var(--mute)}.src a{color:inherit}
.serv{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
.serv button{width:44px;padding:0;font-size:22px}.serv b{font:500 22px "DM Mono",monospace;min-width:2ch;text-align:center}
.stores{margin:14px 0 0;border-top:1.5px dashed var(--line)}
.st{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;align-items:center;padding:12px 0;border-bottom:1.5px dashed var(--line)}
.st .nm{display:flex;align-items:center;font-weight:600}.st small{grid-column:1;color:var(--mute);padding-left:19px}
.st .m{font:500 22px "DM Mono",monospace;text-align:right;white-space:nowrap}.st .m i{font:600 13px Inter,sans-serif;color:var(--tom);font-style:normal;display:block}
.st.best .m{color:var(--tom)}
.split{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;margin-top:16px}
.split .big{font:500 clamp(34px,8vw,46px) "DM Mono",monospace;color:var(--tom);white-space:nowrap;text-align:right}
.split span{font-weight:600}.split small{color:var(--mute)}
.grp{margin:16px 0 0}.grp h4{display:flex;align-items:center;margin:0;padding:10px 0;font-size:16px;border-bottom:2px solid var(--ink)}.grp h4 .t{margin-left:auto;font:500 16px "DM Mono",monospace}
.it{border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:0 12px}
.it>button{all:unset;box-sizing:border-box;flex:1 1 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;padding:11px 2px;cursor:pointer;min-height:44px;align-items:center}
.it>button:focus-visible{outline:3px solid var(--tom)}
.it>.ed{flex-basis:100%}
.it .nm{font-size:15px}.it small{grid-column:1;color:var(--mute);font-size:13px}
.it .c{text-align:right;white-space:nowrap;font:500 16px "DM Mono",monospace}.it .c.miss{color:var(--tom);font:600 14px Inter,sans-serif}
.it.skip .nm{color:var(--mute);text-decoration:line-through}
.ck{width:22px;height:22px;min-height:22px;accent-color:var(--leaf)}
.it.done .nm{text-decoration:line-through;color:var(--mute)}
.est{font:600 11px Inter,sans-serif;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px}
.warn{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:15px}
.ed{background:var(--soft);border-radius:12px;padding:4px 14px 14px;margin:0 0 12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 10px}
.pg{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px 10px;align-items:center;margin-top:8px}
.pg .h{font-size:13px;color:var(--mute);font-weight:600}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;margin-top:12px}.chk input{width:22px;min-height:22px}
ol.meth{padding-left:22px}ol.meth li{margin:0 0 10px;padding-left:4px}
.pr{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,auto);gap:4px 14px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.pr .v{font:500 15px "DM Mono",monospace;text-align:right;white-space:nowrap}.pr .v.lo{color:var(--tom)}.pr small{grid-column:1/-1;color:var(--mute)}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.days{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin:12px 0 18px}
.day{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--paper)}.day.today{border-color:var(--leaf);box-shadow:inset 4px 0 0 var(--leaf)}
.day h4{margin:0 0 4px;font-size:15px}.pe{display:flex;align-items:center;gap:8px;padding:2px 0}.pe .link{text-align:left;flex:1 1 auto;justify-content:flex-start}
.x{min-height:36px;width:36px;padding:0;border-radius:18px;flex:none}
.sp{font:600 11px Inter,sans-serif;color:#fff;background:var(--tom);border-radius:6px;padding:0 5px;margin-left:6px}
li.card{cursor:default}li.card .s{grid-column:1/-1}
.hero{width:calc(100% + 2*clamp(16px,4vw,30px));margin:-22px calc(-1*clamp(16px,4vw,30px)) 16px;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--soft)}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--soft);grid-row:span 2}
.card.has-img{grid-template-columns:64px minmax(0,1fr) auto}
.live{font:600 11px Inter,sans-serif;color:#fff;background:var(--leaf);border-radius:6px;padding:0 5px;margin-left:6px}
.res{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;border-radius:0;font:inherit;color:inherit;min-height:56px}
.res img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:8px;grid-row:span 2}.res b{font-weight:500}.res .pp{font:500 15px "DM Mono",monospace;text-align:right;white-space:nowrap}.res small{color:var(--mute)}
.find{margin-top:12px;border-top:1px dashed var(--line);padding-top:6px}
.star{color:var(--tom)}.favb{min-height:40px;padding:6px 14px;border-radius:20px}.favb[aria-pressed=true]{color:var(--tom);border-color:var(--tom)}
.scan{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:grid;place-items:center;padding:16px}.scan[hidden]{display:none}
.scanbox{width:min(440px,100%);background:#111;color:#fff;border-radius:16px;padding:16px}.scanbox video{width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover}
.empty{text-align:center;padding:36px 10px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;max-width:90vw;font-weight:500;z-index:9}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
@media(max-width:600px){.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.g3 .w{grid-column:1/-1}.pr{grid-template-columns:repeat(3,minmax(0,1fr))}.pr>span:first-child{grid-column:1/-1}.pr .v{text-align:left}}
</style>
</head>
<body>
<header class="top">
  <h1>Recipe Costs</h1>
  <p>Your recipes, costed with official NZ food prices and what you pay at your local supermarkets.</p>
  <nav id="nav"><a href="#recipes">Recipes</a><a href="#plan">Plan</a><a href="#list">List</a><a href="#prices">Prices</a><a href="#stores">Stores</a></nav>
</header>
<main id="app"></main>
<div id="toast" class="toast" hidden></div>
<div id="scan" class="scan" hidden><div class="scanbox"><p style="margin:0 0 8px;font-weight:600">Point the camera at a barcode</p><video id="scanv" playsinline muted></video><p id="scanmsg" class="hint" style="color:#ddd">Starting camera…</p>
<form id="scanman" class="row"><input id="scancode" inputmode="numeric" placeholder="Or type the barcode number" aria-label="Barcode number" style="flex:1 1 160px"><button>Look up</button></form>
<button id="scanclose" style="margin-top:10px;width:100%">Close</button></div></div>
<script>
{
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Math.round(n*100)/100).toFixed(2);
const key=n=>String(n||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,80)||'item';
const clone=o=>JSON.parse(JSON.stringify(o));
const CH=[{id:'pns',n:'Pak’nSave'},{id:'ww',n:'Woolworths'},{id:'nw',n:'New World'}];
const dot=c=>`<span class="dot" style="background:var(--${c})"></span>`;
const S={recipes:{},prices:{},st:{use:{pns:true,ww:false,nw:true},names:{},ids:{}},storeList:{},geo:null,find:null,sq:'',avg:null,pantry:{items:{}},padd:false,list:{recipes:{},checked:{}},view:'recipes',cur:null,serv:null,edit:null,pedit:null,meta:false,q:'',tag:'',pq:'',db:null,sample:null,loading:true,busy:'',note:'',draft:{src:'',text:''},plan:{weeks:{}},wk:null,pick:null,ideas:[],planPick:false};
const HH={id:null};
const LIVE=false; // live supermarket feeds switched off until a permitted data source exists
async function api(path,opt={}){const r=await fetch('/api'+path,{...opt,headers:{'content-type':'application/json',...(opt.headers||{})}});let js=null;try{js=await r.json()}catch(e){}if(!r.ok)throw new Error(js&&js.error||('Error '+r.status));return js}
const EA_G={onion:150,'brown onion':150,'red onion':150,garlic:5,'garlic clove':5,carrot:100,potato:150,kumara:250,tomato:120,capsicum:160,lemon:100,lime:70,apple:150,banana:120,courgette:200,cucumber:350,avocado:170,'spring onion':15,egg:60,eggs:60};
const chains=()=>CH.filter(c=>S.st.use[c.id]!==false);
const sname=c=>S.st.names&&S.st.names[c.id]?S.st.names[c.id]:c.n;

function flash(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(flash.t);flash.t=setTimeout(()=>t.hidden=true,3200)}

const DOC={st:['settings','stores'],list:['settings','list'],plan:['settings','plan'],pantry:['settings','pantry']};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dayLbl=d=>d.toLocaleDateString('en-NZ',{weekday:'short',day:'numeric',month:'short'});
const season=d=>{const m=d.getMonth();return m>=11||m<=1?'summer':m<=4?'autumn':m<=7?'winter':'spring'};
const SEASON={spring:['asparagus','broad beans','spinach','silverbeet','lettuce','spring onions','new potatoes','peas','rhubarb','strawberries','broccoli','cauliflower','cabbage','leeks','avocado'],
 summer:['tomatoes','courgettes','corn','strawberries','blueberries','raspberries','cherries','peaches','nectarines','apricots','plums','cucumber','capsicum','green beans','lettuce','new potatoes','eggplant'],
 autumn:['apples','pears','feijoas','pumpkin','kumara','mushrooms','cauliflower','broccoli','leeks','plums','beetroot','silverbeet','cabbage'],
 winter:['pumpkin','kumara','cabbage','cauliflower','broccoli','leeks','carrots','parsnips','swede','mandarins','oranges','lemons','kiwifruit','silverbeet','brussels sprouts']};
S.wk=monday(new Date());
async function save(col,id,obj){
  if(DOC[col])S[col]=obj;else S[col][id]=obj;
  const [c,d]=DOC[col]||[col,id];
  try{await api(`/hh/${HH.id}/doc/${c}/${encodeURIComponent(d)}`,{method:'PUT',body:JSON.stringify(obj)})}catch(e){flash('Could not save: '+e.message)}
}
async function drop(col,id){delete S[col][id];try{await api(`/hh/${HH.id}/doc/${col}/${encodeURIComponent(id)}`,{method:'DELETE'})}catch(e){flash('Could not delete that.')}}

/* ---------- units & parsing ---------- */
const U={g:['g',1],gm:['g',1],gram:['g',1],grams:['g',1],kg:['g',1000],kilogram:['g',1000],kilograms:['g',1000],oz:['g',28.35],lb:['g',453.6],lbs:['g',453.6],ml:['ml',1],l:['ml',1000],litre:['ml',1000],litres:['ml',1000],cup:['ml',250],cups:['ml',250],tbsp:['ml',15],tablespoon:['ml',15],tablespoons:['ml',15],tsp:['ml',5],teaspoon:['ml',5],teaspoons:['ml',5],pinch:['g',0.5]};
const FR={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125};
function fq(a,b){if(b==='ea')return (Math.round(a*100)/100)+' ea';if(a>=1000)return (Math.round(a/10)/100)+(b==='g'?' kg':' L');return Math.round(a*10)/10+' '+b}
function parseLine(line){
  let s=line.replace(/[½¼¾⅓⅔⅛]/g,m=>' '+FR[m]+' ').replace(/\s+/g,' ').trim(),q=0,m,n=0;
  while(n<2&&(m=s.match(/^(\d+\/\d+|\d+(?:\.\d+)?)\s*/))){const t=m[1];q+=t.includes('/')?(+t.split('/')[0]/ +t.split('/')[1]):+t;s=s.slice(m[0].length);n++}
  s=s.replace(/^[-–]\s*\d+(?:\.\d+)?\s*/,'').replace(/^x\s+/i,'');
  let base='ea',amt=q,w=(s.split(' ')[0]||'').toLowerCase().replace(/\.$/,'');
  if(q&&U[w]){base=U[w][0];amt=q*U[w][1];s=s.slice(s.split(' ')[0].length).trim()}
  const name=s.replace(/\(.*?\)/g,'').split(',')[0].replace(/^of\s+/i,'').trim().toLowerCase();
  return {line:line.trim(),name:name||line.trim().toLowerCase(),amount:amt||0,base,skip:!q||/to taste|for serving|optional/i.test(line)};
}
function localParse(text,src){
  const L=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
  const title=(L.find(x=>!/^[-•*\d½¼¾⅓⅔]/.test(x))||'Untitled recipe').slice(0,90);
  const mi=L.findIndex(x=>/^(method|directions|instructions|steps)\b/i.test(x));
  const ingL=(mi>0?L.slice(0,mi):L).filter(x=>/^([-•*]\s*)?[\d½¼¾⅓⅔⅛]/.test(x));
  return {title,servings:+((text.match(/serves\s*(\d+)/i)||[])[1])||4,source:src,ingredients:ingL.map(x=>parseLine(x.replace(/^[-•*]\s*/,''))),method:mi>=0?L.slice(mi+1).map(x=>x.replace(/^(\d+[.)]|[-•*])\s*/,'')):[],tags:[],notes:''};
}

/* ---------- Claude helpers ---------- */
async function claudeParse(text,src){
  const r=await S.sample.json(`Turn this pasted recipe into JSON. Return only {"title":string,"servings":number,"tags":string[],"ingredients":[{"line":string,"name":string,"amount":number,"base":"g"|"ml"|"ea","skip":boolean}],"method":string[]}.
- line: the ingredient line as written.
- name: short generic NZ supermarket product name, lowercase (e.g. "beef mince", "plain flour", "canned chopped tomatoes", "brown onion").
- amount + base: quantity used, in grams ("g") for solids, millilitres ("ml") for liquids/oils, or count ("ea") for items sold singly (eggs, onions, garlic cloves, lemons). Convert cups/spoons of dry goods to grams with typical densities. NZ cup = 250 ml, tbsp = 15 ml, tsp = 5 ml. A whole can/jar/packet: its stated weight in g.
- Unquantified items like "cooking oil": a sensible amount (e.g. 15 ml).
- skip: true only for water and "salt and pepper to taste".
- servings: lowest number if a range; 4 if not stated.
- tags: 1-3 short lowercase tags such as "dinner", "beef", "baking".
- method: the steps as written, one string each; [] if none given.
Recipe:
"""${text.slice(0,14000)}"""`,{modelTier:'quick'});
  if(!r||!Array.isArray(r.ingredients))throw new Error('bad');
  return {title:String(r.title||'Untitled recipe').slice(0,90),servings:+r.servings||4,source:src,tags:Array.isArray(r.tags)?r.tags.map(String).slice(0,4):[],notes:'',method:Array.isArray(r.method)?r.method.map(String):[],
    ingredients:r.ingredients.map(i=>({line:String(i.line||i.name||''),name:String(i.name||'').toLowerCase(),amount:+i.amount||0,base:['g','ml','ea'].includes(i.base)?i.base:'ea',skip:!!i.skip}))};
}
const storeOf=c=>S.st.ids&&S.st.ids[c];
const liveChains=()=>['pns','nw'].filter(c=>S.st.use[c]!==false&&storeOf(c));
function pick(res,ing){
  const ok=res.filter(r=>r.price>0);if(!ok.length)return null;
  const same=ok.find(r=>r.base===ing.base)||(ing.base!=='ea'?ok.find(r=>r.base!=='ea'):null)||(ing.base==='ea'&&eaG(ing.name)?ok.find(r=>r.base==='g'):null);
  return same||ok[0];
}
function linkEntry(r,c){return {price:r.price,size:r.size,base:r.base,pid:r.pid,pname:r.name,img:r.img,store:storeOf(c),live:true,deal:r.deal||'',units:r.units,updated:Date.now()}}

/* ---------- Stats NZ average prices ---------- */
const STOP=new Set(['fresh','large','small','medium','chopped','diced','finely','lean','premium','nz','organic','brown','red','plain','of','and','or','the','a','sliced','grated','whole','raw','free','range']);
const BAD=/takeaway|poured|\bhot\b|cooked|fried|novelty|\beach\b|prepared|packaged meal|sandwich|pizza|burger|fish and chips|baby food|infant/i;
const sing=w=>w.replace(/oes$/,'o').replace(/ies$/,'y').replace(/ses$/,'s').replace(/([^s])s$/,'$1');
const toks=x=>String(x||'').toLowerCase().replace(/\(.*?\)/g,' ').split(/[^a-z]+/).filter(Boolean).map(sing);
let AVGIDX=null;
function avgIndex(){if(AVGIDX||!S.avg)return AVGIDX;AVGIDX=(S.avg.items||[]).filter(i=>!BAD.test(i.title)).map(i=>{const head=i.title.replace(/\(.*?\)/g,'').split(/,| - /);return {...i,prim:toks(head[0]),all:new Set(toks(i.title))}});return AVGIDX}
function avgMatch(name){
  const p=S.prices[key(name)];
  if(p&&p.avg==='none')return null;
  const idx=avgIndex();if(!idx)return null;
  if(p&&p.avg){return idx.find(i=>i.id===p.avg)||null}
  const it=toks(name).filter(w=>!STOP.has(w));if(!it.length)return null;
  const canned=it.some(w=>/^(canned|can|tin|tinned)$/.test(w));
  let best=null,bs=-1;
  for(const i of idx){
    if(!i.prim.every(w=>it.includes(w)))continue;
    if(it.length>1&&!it.every(w=>i.all.has(w)||(w==='tinned'&&i.all.has('canned'))))continue;
    if(i.all.has('canned')&&!canned)continue;
    const sc=it.filter(w=>i.all.has(w)).length*10-i.all.size;
    if(sc>bs){bs=sc;best=i}}
  return best;
}
function avgLine(it){const m=avgMatch(it.name);if(!m)return null;let amt=it.amt,approx=false;
  if(m.base!==it.base){if(m.base!=='ea'&&it.base!=='ea')approx=true;else if(it.base==='ea'&&m.base==='g'&&eaG(it.name)){amt=it.amt*eaG(it.name);approx=true}else return null}
  return {c:amt/m.size*m.price,m,approx,amt};}
const avgPeriod=()=>{if(!S.avg||!S.avg.period)return '';const [y,mo]=S.avg.period.split('.');return new Date(+y,+mo-1,1).toLocaleDateString('en-NZ',{month:'short',year:'numeric'})};

/* ---------- costing ---------- */
const eaG=name=>{const n=String(name||'').toLowerCase();return EA_G[n]||EA_G[n.replace(/s$/,'')]||Object.entries(EA_G).find(([k])=>n.endsWith(k))?.[1]||null};
function lineAt(it,cid){const p=S.prices[it.key],q=p&&p[cid];
  if(!q||!(+q.size>0)||!(+q.price>0))return null;
  const b=q.base||p.base;let amt=it.amt,approx=false;
  if(b!==it.base){
    if(b!=='ea'&&it.base!=='ea')approx=true;
    else if(it.base==='ea'&&b==='g'&&eaG(it.name)){amt=it.amt*eaG(it.name);approx=true}
    else return null}
  return {c:amt/ +q.size* +q.price,q,approx,b,amt};}
const byWeight=m=>/, 1kg$/i.test(m.title)&&!/frozen|supermarket only|flour|sugar|rice|biscuit|nugget|fries|cereal|muesli/i.test(m.title);
const packsOf=(amt,size)=>Math.max(1,Math.ceil(amt/size-1e-6));
function costItems(items,packs){
  const ch=chains(),tot={},miss={},groups={},un=[];let split=0;

  for(const it of items){let best=null;
    for(const c of ch){const l=lineAt(it,c.id);if(!l){miss[c.id]++;continue}if(packs){l.packs=packsOf(l.amt,+l.q.size);l.c=l.packs* +l.q.price}tot[c.id]+=l.c;if(!best||l.c<best.l.c)best={c:c.id,l}}
    if(best){split+=best.l.c;groups[best.c].push({it,l:best.l})}else un.push(it)}
  let avg=0,avgN=0;for(const it of items){const a=avgLine(it);if(a){if(packs&&!byWeight(a.m)){a.packs=packsOf(a.amt,a.m.size);a.c=a.packs*a.m.price}avg+=a.c;avgN++;it.avg=a}}
  const best=split+un.reduce((t,i)=>t+(i.avg?i.avg.c:0),0),none=un.filter(i=>!i.avg).length;

const priceKey=n=>{const k=key(n);if(S.prices[k])return k;const ak=aggKey(n);const hit=Object.entries(S.prices).find(([,p])=>p&&p.name&&aggKey(p.name)===ak);return hit?hit[0]:k};

async function init(){
  const q=new URLSearchParams(location.search).get('h');let id=q;
  if(!id){try{id=localStorage.getItem('rc-hh')}catch(e){}}
  if(id){HH.id=id;try{localStorage.setItem('rc-hh',id)}catch(e){}if(q)history.replaceState(null,'',location.pathname+location.hash)}
  route();
  if(!HH.id){S.loading=false;render(true);return}
  try{await load()}catch(e){S.loading=false;S.note=/not found/i.test(e.message)?'That household link isn’t valid. Ask for a new link.':'Can’t reach the server right now.';render()}
  api('/statsnz').then(v=>{if(v&&v.items&&v.items.length){S.avg=v;AVGIDX=null;render()}}).catch(()=>{});
  setInterval(()=>{if(document.visibilityState==='visible'&&!S.busy&&!S.find)load().catch(()=>{})},60000);
}
init();
}
</script>
</body>
